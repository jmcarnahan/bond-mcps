[tool.poetry]
name = "bond-auth"
version = "0.2.0"
description = "Shared OAuth callback proxy and encrypted token database for Bond MCP servers"
packages = [{include = "auth"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
sqlalchemy = ">=2.0,<3.0"
alembic = ">=1.13,<2.0"
cryptography = ">=43.0,<46.0"
pyjwt = {version = ">=2.12.0", extras = ["crypto"]}
# psycopg is the runtime driver for postgresql+psycopg:// URLs (Aurora deploys).
# `binary` extra bundles libpq; no apt deps in containers. ~7MB wheel; the
# convenience of not needing a Dockerfile pip install outweighs the cost.
psycopg = {extras = ["binary"], version = "^3.3.4"}
# Authorization Server runtime: Starlette app served by uvicorn, with httpx
# for upstream OIDC calls. Required when `python -m auth.auth_server` is the
# container entrypoint (deployed AS path). python-multipart is the
# form-parsing backend Starlette uses for application/x-www-form-urlencoded
# POSTs (OAuth /oauth/token is form-encoded per RFC 6749).
starlette = ">=0.40,<1.0"
uvicorn = ">=0.30,<1.0"
httpx = ">=0.27,<1.0"
python-multipart = ">=0.0.9,<1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
# fastmcp is needed to exercise build_verifier / build_remote_auth_provider
# and the get_access_token-based resolve_user_key_for_request branches.
# It's not a runtime dependency of `auth/` itself (the proxy server and CLI
# work without it); each MCP package brings it in via its own pyproject.
fastmcp = ">=3.0,<4.0"
# Repo-wide quality tooling. Hosted here because auth/ is the only package
# every dev installs (it backs both the proxy and the AS). Pre-commit hook
# config + runners live at the repo root (.pre-commit-config.yaml, pyproject.toml).
pre-commit = ">=4.0,<5.0"
ruff = ">=0.6,<1.0"
bandit = {version = ">=1.7,<2.0", extras = ["toml"]}

[tool.poetry.scripts]
bond-mcps = "auth.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
