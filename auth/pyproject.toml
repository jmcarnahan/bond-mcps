[tool.poetry]
name = "bond-auth"
version = "0.1.0"
description = "Shared OAuth callback proxy and token store for Bond MCP servers"
packages = [{include = "auth"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
