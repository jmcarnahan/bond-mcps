name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.package }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        package:
          - auth
          - mcps/microsoft
          - mcps/github
          - mcps/atlassian
          - mcps/databricks

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ${{ matrix.package }}/.venv
          key: poetry-${{ runner.os }}-py${{ matrix.python-version }}-${{ matrix.package }}-${{ hashFiles(format('{0}/poetry.lock', matrix.package)) }}

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: poetry install --no-interaction

      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: poetry run pytest -q

  all-tests:
    # Single aggregator check so branch protection only needs to require
    # one status check name. Succeeds iff every job in the matrix succeeded.
    # Add or remove packages/Python versions in the matrix above without
    # touching the ruleset.
    name: All tests
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all matrix jobs passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Matrix result: ${{ needs.test.result }} (expected: success)"
            exit 1
          fi
          echo "All matrix jobs passed."
