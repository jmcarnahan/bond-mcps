name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.package }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        package:
          - auth
          - mcps/microsoft
          - mcps/github
          - mcps/atlassian

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ${{ matrix.package }}/.venv
          key: poetry-${{ runner.os }}-py${{ matrix.python-version }}-${{ matrix.package }}-${{ hashFiles(format('{0}/poetry.lock', matrix.package)) }}

      - name: Configure Poetry to use in-project venv
        working-directory: ${{ matrix.package }}
        run: poetry config virtualenvs.in-project true

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: poetry install --no-interaction

      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: poetry run pytest -q
