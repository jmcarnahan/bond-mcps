# Builds the bond-mcps service images as VALIDATION ONLY — no push, no AWS
# credentials. Publishing moved into `terraform apply`
# (deployment/terraform-existing-vpc/build-stages.tf): the apply computes a
# content-hash tag per image, builds anything ECR doesn't already have, and
# rolls the helm releases. `make deploy-plan && make deploy` is the deploy.
#
# This workflow's job is catching Dockerfile / .dockerignore / dependency
# regressions before merge, on both PRs and main pushes.
#
# Wiring an OIDC role + CI publishing to ECR is deliberate future work; see
# docs/DEPLOYMENT.md ("CI" section) if that's ever wanted.

name: Build images

on:
  push:
    branches: [main]
    paths:
      - 'auth/**'
      - 'mcps/**'
      - '.github/workflows/build-and-push.yml'
  pull_request:
    paths:
      - 'auth/**'
      - 'mcps/**'
      - '.github/workflows/build-and-push.yml'
      - '**/Dockerfile'
      - '**/.dockerignore'

permissions:
  contents: read

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth
            context: auth
            dockerfile: auth/Dockerfile
            needs_shared_auth: false
          - name: mcp-github
            context: mcps/github
            dockerfile: mcps/github/Dockerfile
            needs_shared_auth: true
          - name: mcp-microsoft
            context: mcps/microsoft
            dockerfile: mcps/microsoft/Dockerfile
            needs_shared_auth: true
          - name: mcp-atlassian
            context: mcps/atlassian
            dockerfile: mcps/atlassian/Dockerfile
            needs_shared_auth: true
          - name: mcp-databricks
            context: mcps/databricks
            dockerfile: mcps/databricks/Dockerfile
            needs_shared_auth: true

    steps:
      - uses: actions/checkout@v4

      # MCP Dockerfiles use a path-dep on the auth package via
      # bond-auth = {path = "../../auth"}. From the container's /app/pyproject.toml
      # that resolves to /auth — and the Dockerfile COPYs _shared_auth_pkg/ there.
      # We assemble _shared_auth_pkg/ from the live auth/ subtree at build time.
      - name: Prep shared_auth (MCPs only)
        if: matrix.service.needs_shared_auth
        run: |
          set -euo pipefail
          dest="${{ matrix.service.context }}/_shared_auth_pkg"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -r auth/auth "$dest/auth"
          cp auth/pyproject.toml "$dest/pyproject.toml"
          cp auth/poetry.lock "$dest/poetry.lock"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (validation, no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: bond-mcps/${{ matrix.service.name }}:ci
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,scope=${{ matrix.service.name }},mode=max
