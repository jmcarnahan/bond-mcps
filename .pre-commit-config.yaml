# Pre-commit hooks for bond-mcps. See docs/DEPLOYMENT.md for context.
#
# Install one-time per clone:
#   make hooks-install
#
# Run against the whole repo:
#   make hooks-run
#
# Hook versions are pinned. Bumps via deliberate PRs only — no autoupdate.

exclude: |
  (?x)^(
    \.terraform/.*|
    \.venv/.*|
    mcps/[^/]+/_shared_auth_pkg/.*|
    poetry\.lock$|
    .*/poetry\.lock$|
    tmp/.*
  )$

repos:
  # ---------- Secret scanning ----------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        # Uses .gitleaks.toml at repo root.

  # ---------- Python security lint ----------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        # Bandit reads [tool.bandit] from root pyproject.toml.

  # ---------- Python lint + format ----------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # ---------- Standard file hygiene ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--unsafe"] # Helm templates use {{ }} which yaml.safe_load rejects
        # Helm templates can start with `{{- if ... }}` which neither
        # yaml.safe_load NOR `--unsafe` mode can parse (the file isn't a YAML
        # document at all until templating runs). Skip them entirely; `helm
        # lint` covers their syntax in CI.
        exclude: ^deployment/helm/[^/]+/templates/
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # ---------- Terraform formatting ----------
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
        # `terraform validate` deliberately omitted: requires `terraform init`
        # per module, too slow at commit time. CI lint workflow covers this.

  # ---------- Shell script lint ----------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        # Scoped to actual shell files; .sh extension required.

  # ---------- Local: refuse direct pushes to main ----------
  - repo: local
    hooks:
      - id: no-push-to-main
        name: Refuse direct push to main/master
        entry: scripts/no-push-to-main.sh
        language: script
        stages: [pre-push]
        pass_filenames: false
