{{/*
Intentionally empty.

The plan originally called for a Helm pre-install/pre-upgrade hook Job to run
`bond-mcps migrate-db`. We moved migrations into an initContainer on the auth
Deployment (see deployment.yaml, gated by .Values.migrations.enabled) because:

  1. Helm pre-install hooks fire BEFORE the chart's ExternalSecret resources are
     installed, so a Job would have no db-credentials Secret to mount.
  2. Alembic is idempotent under concurrent runs; multi-replica risk is moot
     because the auth service is single-replica today.
  3. One source of truth for env (the Deployment's secret refs).

This file is kept as documentation of the decision.
*/}}
