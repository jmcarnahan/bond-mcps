{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-service.fullname" . }}
  labels:
    {{- include "mcp-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound from the ALB controller's pods (data plane reaches
    # service pods via Pod IPs since target-type: ip).
    - from:
        - podSelector:
            {{- toYaml .Values.networkPolicy.albControllerSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
    # Allow inbound from sibling bond-mcps pods (MCPs poll the auth proxy).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: bond-mcps
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
  egress:
    # Egress is intentionally open: pods need DNS, Aurora, AWS APIs
    # (SM, STS), the auth proxy's in-cluster DNS, and provider OAuth
    # endpoints. NetworkPolicy at L4 can't gracefully express
    # "everything except known-bad", so we deny-ingress + allow-egress
    # rather than fight a moving target.
    - {}
{{- end -}}
