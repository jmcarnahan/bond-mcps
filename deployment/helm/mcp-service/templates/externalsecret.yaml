{{- /*
One ExternalSecret per enabled source. Each produces a k8s Secret named
"<fullname>-<key>" that the Deployment consumes via envFrom (see _helpers.tpl).

Encryption key + OAuth: JSON keys in Secrets Manager are reused verbatim as env
var names, so we use dataFrom.extract — every JSON field becomes a Secret key.

DB credentials: JSON has username/password/host/port/dbname; we assemble
BOND_MCPS_DB_URL via the template feature.
*/ -}}

{{- if .Values.secrets.encryptionKey.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "mcp-service.fullname" . }}-encryption-key
  labels:
    {{- include "mcp-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "mcp-service.fullname" . }}-encryption-key
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.secrets.encryptionKey.secretsManagerName | quote }}
---
{{- end }}

{{- if .Values.secrets.db.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "mcp-service.fullname" . }}-db
  labels:
    {{- include "mcp-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "mcp-service.fullname" . }}-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace  # only emit BOND_MCPS_DB_URL; drop raw username/password fields
      data:
        BOND_MCPS_DB_URL: "postgresql+psycopg://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ `{{ .host }}` }}:{{ `{{ .port }}` }}/{{ `{{ .dbname }}` }}?sslmode={{ .Values.secrets.db.sslmode }}"
  dataFrom:
    - extract:
        key: {{ .Values.secrets.db.secretsManagerName | quote }}
---
{{- end }}

{{- if .Values.secrets.oauth.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "mcp-service.fullname" . }}-oauth
  labels:
    {{- include "mcp-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "mcp-service.fullname" . }}-oauth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.secrets.oauth.secretsManagerName | quote }}
{{- end }}
