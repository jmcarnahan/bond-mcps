# Default values for one bond-mcps service (auth proxy OR an MCP server).
# Every key is documented; values.schema.json enforces structure.

nameOverride: ""
fullnameOverride: ""

image:
  repository: "PLACEHOLDER"    # full ECR URI; Terraform passes the real value
  tag: "0.0.0"
  pullPolicy: IfNotPresent

# Override the image CMD only if needed. Both auth and MCP Dockerfiles already
# bind to 0.0.0.0:8000, so leaving this empty is correct in the default case.
command: []

# Container port. All current images listen on 8000 internally.
port: 8000

replicas: 1

# Set true ONLY for the auth proxy service. Used by _helpers.tpl to
# hard-fail when replicas > 1: auth holds in-memory pending OAuth state
# (auth/proxy_server.py STATE_TTL), so a second replica would silently
# break OAuth callbacks because the redirect could land on a pod that
# doesn't have the matching state row.
isAuthProxy: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Non-sensitive env vars rendered into the ConfigMap.
# When authProxy.inject=true, AUTH_PROXY_HOST + BOND_AUTH_PROXY_PORT are merged in
# automatically so the operator does not have to repeat them per MCP.
#
# NEVER set BOND_MCPS_SKIP_STARTUP_VERIFY here — it defeats the fail-fast
# guarantee in auth/auth/startup.py.
env: {}

# === BOND_MCPS_USER_ID — multi-tenancy boundary ===
# Owner identifier for cached tokens in the encrypted DB.
# REQUIRED on Postgres deployments — empty value crashes pods at startup
# (auth/auth/cli.py:113, auth/auth/startup.py:55).
#
# CAVEAT (read before deploying multi-tenant): today this is one value per
# pod, NOT per request. All API calls from this pod read and write the same
# token DB row. Implications:
#   - Single-tenant deploy: fine. Use any stable string (e.g. "bond-mcps-dev").
#   - Multi-tenant deploy: BROKEN. Tokens are shared across users. The fix is
#     to make the MCPs derive user_key from the incoming Bearer JWT's `sub`
#     claim (proxy_client.py + per-MCP auth modules). The env shape here
#     does not change when that fix lands; only application code does.
userKey: ""

# For MCP services. Set inject: true and host: to the in-cluster DNS of the
# auth proxy Service. The auth proxy itself sets inject: false.
authProxy:
  inject: false
  host: ""                     # e.g. auth.bond-mcps.svc.cluster.local
  port: 8000
  # Public origin the OAuth provider can reach for callbacks. Injected as
  # BOND_AUTH_PROXY_PUBLIC_URL — auth/proxy_client.py:get_redirect_uri uses
  # it to build redirect URIs the provider redirects to after the user
  # authorizes. Without this, MCPs fall back to http://localhost which only
  # works in local dev.
  publicUrl: ""                # e.g. https://auth.mcps.example.com

# Secrets are sourced from AWS Secrets Manager via External Secrets Operator.
# Each enabled entry renders one ExternalSecret that materialises a k8s Secret
# named "<fullname>-<key>". That Secret is consumed by the Deployment via envFrom,
# so the SM JSON keys MUST equal the desired env var names (except `db`, which
# uses templating to assemble BOND_MCPS_DB_URL from username/password/host/port/dbname).
secrets:
  encryptionKey:
    enabled: true
    secretsManagerName: ""     # e.g. bond-mcps-dev-encryption-key
    # JSON shape: {"BOND_MCPS_ENCRYPTION_KEY": "<base64>"}  (SM key == env var name)
  db:
    enabled: true
    secretsManagerName: ""     # e.g. bond-mcps-dev-db-credentials
    # JSON shape: {"username","password","host","port","dbname"} → templated into URL.
    # Default `require` is permissive (accepts any cert). For prod hardening,
    # set to `verify-full` AND mount the RDS root CA bundle (chart does not
    # handle the volume mount today — v2 work).
    sslmode: require
  oauth:
    enabled: false
    secretsManagerName: ""     # e.g. bond-mcps-dev-github-oauth
    # JSON shape: keys ARE the env var names. e.g.
    #   {"GITHUB_CLIENT_ID":"…","GITHUB_CLIENT_SECRET":"…"}

# === Multi-tenant identity via JWT verification ===
# Opt-in. When enabled, every HTTP request that reaches a Path-2 token-DB
# operation MUST carry `X-Bond-Auth: Bearer <jwt>`. The JWT's signature is
# verified against the operator-supplied public key (pulled from SM) and the
# configured claim (default `sub`) becomes the user_key for that request.
#
# When disabled (default), the chart's `userKey` value is used for every
# caller (single-tenant). See README "Known limitations" for the tradeoff.
jwt:
  enabled: false
  secretsManagerName: ""       # SM secret with {"BOND_MCPS_JWT_PUBLIC_KEY": "<PEM>"}
  issuer: ""                   # optional iss-claim check
  audience: ""                 # optional aud-claim check
  algorithm: "RS256"
  subClaim: "sub"

# Reference to the ClusterSecretStore created by external-secrets.tf.
externalSecrets:
  clusterSecretStoreName: bond-mcps-aws-sm
  # 5m is a deliberate compromise: fast enough that rotating a leaked secret
  # propagates quickly; slow enough that AWS SM API costs stay negligible
  # (4 services × ~3 secrets × 12 reads/hour = ~144 calls/hour).
  refreshInterval: 5m

serviceAccount:
  create: true
  annotations: {}              # set eks.amazonaws.com/role-arn here if this service needs IRSA

ingress:
  enabled: true
  host: ""                     # e.g. auth.mcps.ai.example.com
  className: alb
  certificateArn: ""           # ACM cert ARN; Terraform passes it
  groupName: bond-mcps         # alb.ingress.kubernetes.io/group.name — shared ALB
  groupOrder: 10
  scheme: internet-facing
  healthCheckPath: /health     # auth serves /health; MCPs fall back to TCP target health
  successCodes: "200-299"
  # ALB tag stamped via alb.ingress.kubernetes.io/tags. Together with
  # elbv2.k8s.aws/cluster + ingress.k8s.aws/stack, this uniquely identifies
  # the ALB across environments so eks-domain.tf's tag-filtered lookup can't
  # match a stale or cross-env load balancer.
  environmentTag: ""           # passed by Terraform (var.environment)

probes:
  liveness:
    type: tcp                  # "http" for auth (with path: /health) or "tcp" for MCPs
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    type: tcp
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

# === Database migrations ===
# Enable ONLY for the auth service. When true, an initContainer runs Alembic
# (`bond-mcps migrate-db`) on every pod start. Alembic is idempotent under
# concurrent runs; safe even with multiple replicas.
migrations:
  enabled: false
  command: ["bond-mcps", "migrate-db"]

# === Startup pre-flight check ===
# Enable for ALL services. Runs `bond-mcps doctor` (auth/auth/cli.py:81) to
# verify: BOND_MCPS_DB_URL reachable, schema at Alembic head, encryption key
# round-trips, and (on Postgres) BOND_MCPS_USER_ID is set. Container fails
# fast on misconfig instead of accepting traffic and erroring per request.
#
# On first install, MCP doctor checks fail until the auth service has finished
# `migrate-db`. K8s restarts the initContainer with exponential backoff;
# expect 1-2 minutes of cold-start retries before MCPs are Ready.
preflight:
  enabled: true
  command: ["bond-mcps", "doctor"]

pdb:
  enabled: false
  minAvailable: 1

# === NetworkPolicy ===
# When enabled, the chart adds a default-deny-ingress NetworkPolicy that
# permits inbound TCP on .Values.port from the entire VPC CIDR — that
# covers both ALB → pod traffic (ALB ENIs live in public VPC subnets)
# and intra-cluster pod-to-pod traffic (MCPs polling the auth proxy).
# Egress is left open: pods need DNS, Aurora, AWS APIs, and provider
# OAuth endpoints; tightening at L4 is brittle, so we rely on Security
# Groups + IAM for egress restrictions instead.
#
# Off by default. Enabling requires vpcCidr be set (Terraform passes
# data.aws_vpc.existing.cidr_block via modules/service); the template
# fails fast if you enable the policy without it.
networkPolicy:
  enabled: false
  vpcCidr: ""

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
